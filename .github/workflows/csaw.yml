name: essai csaw

# Lancement manuel de l'agent sur la base CSAW 2026. Gratuit sur un dépôt public.
# GitHub Actions fournit Docker : c'est ce qui permet de jouer les 12 challenges
# à serveur, impossibles sur Kaggle ou Colab. La clé du modèle vient d'un secret
# (jamais écrite dans la trace), passée à l'agent via CSAW_API_KEY.
#
# Avant le premier lancement : Settings → Secrets and variables → Actions, ajouter
# au moins OPENROUTER_API_KEY (clé créée sur https://openrouter.ai/keys). Le modèle par
# défaut openrouter:openrouter/free route automatiquement vers un modèle gratuit disponible,
# ce qui évite les noms de modèles qui changent. Pour le routage multi-modèles ou d'autres
# fournisseurs, ajouter aussi les clés utiles : GEMINI_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY,
# DEEPSEEK_API_KEY, NVIDIA_API_KEY (les secrets absents restent vides, sans erreur).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle unique (préréglage:nom) ; ignoré si 'models' est rempli"
        default: "openrouter:openrouter/free"
      models:
        description: "Routage par catégorie, p. ex. crypto=openrouter:openrouter/free,default=openrouter:openrouter/free"
        default: ""
      cascade:
        description: "Cascade frugale 'gratuit>fort' (le code escalade quand la progression stagne) ; remplace model/models"
        default: ""
      categories:
        description: "Catégories séparées par un espace (vide = toutes)"
        default: ""
      only:
        description: "Identifiants de challenge séparés par un espace (vide = tous)"
        default: ""
      max_steps:
        description: "Budget d'actions par challenge"
        default: "40"
      docker:
        description: "Démarrer les conteneurs des challenges à serveur"
        type: boolean
        default: true
      indices:
        description: 'Approche hybride : JSON {"identifiant": "indice humain"} (jamais de flag ni de solution ; vide = autonome)'
        default: ""
      atelier:
        description: "Agent forgeron : garder et réutiliser d'un challenge à l'autre les outils que l'agent écrit"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils d'analyse et utilisateur du bac à sable
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # tshark : coupe l'invite debconf dont le postinst peut bloquer.
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          for i in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -qq update && break
            echo "apt-get update : tentative $i échouée, nouvelle tentative"; sleep 5
          done
          # Outils essentiels (bloquant) puis optionnels pcap/audio (best-effort) :
          # un miroir lent ne doit pas faire perdre un essai complet.
          sudo timeout 300 apt-get -o Acquire::Retries=3 -qq install -y \
            file binutils p7zip-full unzip sqlite3 xxd libimage-exiftool-perl \
            || { echo "échec d'installation des outils essentiels"; exit 1; }
          sudo timeout 300 apt-get -o Acquire::Retries=3 -qq install -y tshark sox \
            || echo "outils optionnels (tshark/sox) non installés : on continue"
          # Outils pwn (best-effort) : un débogueur dans le bac à sable pour la catégorie pwn.
          sudo timeout 300 apt-get -o Acquire::Retries=3 -qq install -y gdb \
            || echo "gdb non installé : on continue"
          pip install pytest pycryptodome scapy pyyaml
          pip install pwntools || echo "pwntools non installé : on continue"
          id ctfsandbox || sudo useradd -M -s /bin/bash ctfsandbox

      - name: Cloner la base CSAW 2026
        run: git clone --depth 1 https://github.com/NYU-LLM-CTF/CSAW26_LLMAC_DB.git

      - name: Préparer les options
        id: opts
        env:
          # Passé par l'environnement, jamais interpolé dans le script (guillemets du JSON).
          INDICES: ${{ inputs.indices }}
          CASCADE: ${{ inputs.cascade }}
        run: |
          opts=""
          if [ -n "$INDICES" ]; then
            printf '%s' "$INDICES" > indices.json
            opts="$opts --indices indices.json"
          fi
          for c in ${{ inputs.categories }}; do opts="$opts --category $c"; done
          for o in ${{ inputs.only }}; do opts="$opts --only $o"; done
          if [ "${{ inputs.docker }}" = "true" ]; then opts="$opts --docker"; fi
          # Atelier rangé SOUS runs/ pour que l'artefact garde une racine unique
          # (bilan.json à la racine ; sinon l'assemblage ne le trouve pas).
          if [ "${{ inputs.atelier }}" = "true" ]; then opts="$opts --atelier runs/atelier"; fi
          # Cascade si remplie, sinon routage multi-modèles, sinon modèle unique.
          if [ -n "$CASCADE" ]; then
            printf '%s' "$CASCADE" > cascade.txt
            opts="$opts --cascade @cascade.txt"  # « > » ne doit pas passer par le shell
          elif [ -n "${{ inputs.models }}" ]; then
            opts="$opts --models ${{ inputs.models }}"
          else
            opts="$opts --model ${{ inputs.model }}"
          fi
          echo "opts=$opts" >> "$GITHUB_OUTPUT"

      - name: Lancer l'agent
        env:
          # Une clé par fournisseur (secrets du dépôt). Le routage peut en utiliser
          # plusieurs ; un modèle unique n'a besoin que de la clé correspondante.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # root pour le bac à sable (setpriv vers ctfsandbox) ; -E garde les clés.
          sudo -E env "PATH=$PATH" \
            GEMINI_API_KEY="$GEMINI_API_KEY" OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            GROQ_API_KEY="$GROQ_API_KEY" CEREBRAS_API_KEY="$CEREBRAS_API_KEY" \
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            python -m csaw_agent run-all CSAW26_LLMAC_DB/dataset.json \
              --max-steps ${{ inputs.max_steps }} \
              --runs-dir runs --shell ${{ steps.opts.outputs.opts }}

      - name: Résumé
        if: always()
        run: |
          sudo chown -R "$USER" runs 2>/dev/null || true
          test -f runs/bilan.json && python -c "import json;[print(f\"{r['status']:<18} {r.get('id')}\") for r in json.load(open('runs/bilan.json'))]" || echo "pas de bilan"
          test -f runs/atelier/index.json && echo "Outils forgés :" && cat runs/atelier/index.json || true

      - name: Publier les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/
