name: dossier des échecs

# Préparation de l'approche hybride, à coût nul (aucun LLM) : télécharge les
# artefacts « runs » d'essais terminés et liste, pour chaque challenge jamais
# résolu, ce que l'agent a tenté (modèles, outils, commandes, dernières pensées).
# L'humain s'en sert pour écrire un indice d'orientation, jamais une solution.
# On ne lit que nos traces : la base CSAW (et ses solutions) n'est pas clonée ici.

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "ID des essais csaw, séparés par un espace"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger les artefacts des essais
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${{ inputs.run_ids }}; do
            gh run download "$id" --repo "${{ github.repository }}" --name runs --dir "essais/$id" || true
          done

      - name: Dossier des échecs
        run: |
          shopt -s globstar nullglob
          traces=(essais/**/trace.jsonl)
          echo "${#traces[@]} trace(s) trouvée(s)."
          python -m csaw_agent echecs "${traces[@]}" --out echecs.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-echecs
          path: echecs.md
